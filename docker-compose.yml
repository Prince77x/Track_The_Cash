services:
  db:
    image: postgres:16-alpine
    container_name: ttc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: track_the_cash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ttc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/track_the_cash
      JWT_SECRET: ${JWT_SECRET:-super-secret-track-the-cash-sih2026-key}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 8
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@trackthecash.gov.in}
      MODEL_PATH: /app/models/xgboost_atm_risk.joblib
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app/models

  ml-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile.ml
    container_name: ttc-ml-runner
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/track_the_cash
      MODEL_PATH: /app/models/xgboost_atm_risk.joblib
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ttc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  model_data:
