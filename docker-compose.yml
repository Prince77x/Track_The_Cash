services:
  # Single Standalone Track the Cash Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: track-the-cash
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./track_the_cash.db
      JWT_SECRET: ${JWT_SECRET:-super-secret-track-the-cash-sih2026-key}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 8
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@trackthecash.gov.in}
      MODEL_PATH: /app/models/xgboost_atm_risk.joblib
    volumes:
      - data_volume:/app/data
      - model_volume:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  data_volume:
    driver: local
  model_volume:
    driver: local
